<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bitácora de Lavado de Rejas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1c1f24;
    --panel: #262b33;
    --panel-2: #2f353e;
    --line: #3a4149;
    --text: #e8e6e1;
    --muted: #8b93a0;
    --amber: #f2a93b;
    --amber-dim: #7a5a22;
    --green: #4caf7d;
    --red: #e2543d;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #232830 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .brand{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
  }
  header.top{
    position:sticky; top:0; z-index:10;
    background:linear-gradient(180deg, #1c1f24 80%, rgba(28,31,36,0));
    padding:18px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:720px; margin:0 auto;
    display:flex; align-items:center; gap:12px;
  }
  .tag{
    width:38px;height:38px;border-radius:8px;
    background:repeating-linear-gradient(45deg, var(--amber) 0 6px, #1c1f24 6px 12px);
    border:2px solid var(--amber);
    flex:0 0 auto;
  }
  h1.brand{
    font-size:22px; font-weight:700; letter-spacing:0.03em; margin:0;
    line-height:1.05;
  }
  .subtitle{
    color:var(--muted); font-size:12.5px; margin-top:2px;
  }

  main{max-width:720px; margin:0 auto; padding:18px 16px 0;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:22px;
  }
  .card-title{
    font-family:'Barlow Condensed',sans-serif;
    text-transform:uppercase;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--amber);
    margin:0 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .card-title::before{
    content:'';
    width:6px;height:6px;background:var(--amber);
    display:inline-block;
    transform:rotate(45deg);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 12px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{
    font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); font-weight:600;
  }
  input[type=date], input[type=time], input[type=number], input[type=text]{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    padding:10px 10px;
    border-radius:8px;
    width: 80%;
  }
  input[type=text].unidad{
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:600;
  }
  input:focus, button:focus, .stamp:focus{
    outline:2px solid var(--amber);
    outline-offset:1px;
  }
  input::-webkit-calendar-picker-indicator{filter:invert(0.7);}

  .stamp-group{
    display:flex; gap:10px;
  }
  .stamp{
    flex:1;
    background:var(--panel-2);
    border:2px dashed var(--line);
    color:var(--muted);
    border-radius:8px;
    padding:10px 8px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
    transition:all .12s ease;
  }
  .stamp.active[data-v="viaje"]{
    border-color:var(--amber); color:var(--amber); border-style:solid;
    background:rgba(242,169,59,0.08);
  }
  .stamp.active[data-v="procesado"]{
    border-color:var(--green); color:var(--green); border-style:solid;
    background:rgba(76,175,125,0.08);
  }

  .dur-row{display:flex; gap:8px; align-items:center;}
  .dur-row input{width:100%;}
  .dur-sep{color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .btn-add{
    margin-top:16px;
    width:100%;
    background:var(--amber);
    color:#1c1f24;
    border:none;
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
  }
  .btn-add:active{transform:translateY(1px);}

  .err{
    color:var(--red); font-size:12.5px; margin-top:8px; min-height:14px;
  }

  /* ticket perforation divider */
  .perf{
    display:flex; align-items:center; gap:6px;
    margin:6px 0 20px;
    color:var(--muted);
  }
  .perf::before,.perf::after{
    content:'';
    flex:1;
    height:0;
    border-top:2px dashed var(--line);
  }
  .perf span{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-family:'Barlow Condensed',sans-serif;}

  .log-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:12px;
  }
  .count-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--muted);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:3px 9px; border-radius:20px;
  }

  .entry{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-left:3px solid var(--amber);
    border-radius:8px;
    padding:12px 12px;
    margin-bottom:10px;
    position:relative;
  }
  .entry.procesado{border-left-color:var(--green);}
  .entry-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px;
  }
  .unidad-tag{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700; font-size:18px; letter-spacing:0.03em;
  }
  .origen-tag{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    padding:2px 8px; border-radius:20px;
    font-family:'Barlow Condensed',sans-serif;
    border:1px solid var(--amber); color:var(--amber);
  }
  .entry.procesado .origen-tag{border-color:var(--green); color:var(--green);}
  .del-btn{
    background:none; border:none; color:var(--muted);
    font-size:16px; cursor:pointer; padding:2px 6px;
    line-height:1;
  }
  .del-btn:hover{color:var(--red);}

  .entry-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .entry-grid .lbl{color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; display:block;}
  .entry-grid .val{color:var(--text);}
  .val.clean{color:var(--green);}
  .val.dirty{color:var(--red);}

  .empty{
    text-align:center; color:var(--muted); font-size:13.5px;
    padding:30px 10px;
    border:1px dashed var(--line); border-radius:8px;
  }

  footer{
    max-width:720px; margin:24px auto 0; padding:0 16px;
    color:var(--muted); font-size:11px; text-align:center;
  }

  @media (max-width:420px){
    .grid{grid-template-columns:1fr 1fr;}
    h1.brand{font-size:19px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="tag" aria-hidden="true"></div>
    <div>
      <h1 class="brand">Bitácora de Rejas</h1>
      <div class="subtitle">Registro de turno · guardado en este dispositivo</div>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <h2 class="card-title">Nuevo registro</h2>

    <div class="grid">
      <div class="field">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label for="unidad">No. económico</label>
        <input type="text" id="unidad" class="unidad" placeholder="V-03" maxlength="12">
      </div>

      <div class="field full">
        <label>Origen de la unidad</label>
        <div class="stamp-group">
          <div class="stamp" data-v="viaje" id="stampViaje">Viaje</div>
          <div class="stamp" data-v="procesado" id="stampProcesado">Procesado</div>
        </div>
      </div>

      <div class="field">
        <label for="horaInicio">Hora de inicio</label>
        <input type="time" id="horaInicio">
      </div>
      <div class="field">
        <label for="horaFin">Hora de fin</label>
        <input type="time" id="horaFin">
      </div>

      <div class="field">
        <label for="limpias">Rejas limpias</label>
        <input type="number" id="limpias" min="0" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label for="sucias">Rejas sucias</label>
        <input type="number" id="sucias" min="0" inputmode="numeric" placeholder="0">
      </div>

      <div class="field full">
        <label>Duración lavado a mano</label>
        <div class="dur-row">
          <input type="number" id="durHoras" min="0" inputmode="numeric" placeholder="Horas">
          <span class="dur-sep">h</span>
          <input type="number" id="durMin" min="0" max="59" inputmode="numeric" placeholder="Min">
          <span class="dur-sep">min</span>
        </div>
      </div>
    </div>

    <div class="err" id="errMsg"></div>
    <button class="btn-add" id="btnAdd">Agregar registro</button>
  </section>

  <div class="perf"><span>Historial de turno</span></div>

  <section>
    <div class="log-header">
      <h2 class="card-title" style="margin:0;">Registros</h2>
      <span class="count-pill" id="countPill">0 registros</span>
    </div>
    <div id="log"></div>
  </section>
</main>

<footer>Los datos se guardan solo en este navegador/dispositivo.</footer>

<script>
  const STORAGE_KEY = 'rejas_log_v1';
  let origenSel = null;

  const els = {
    fecha: document.getElementById('fecha'),
    unidad: document.getElementById('unidad'),
    horaInicio: document.getElementById('horaInicio'),
    horaFin: document.getElementById('horaFin'),
    limpias: document.getElementById('limpias'),
    sucias: document.getElementById('sucias'),
    durHoras: document.getElementById('durHoras'),
    durMin: document.getElementById('durMin'),
    err: document.getElementById('errMsg'),
    log: document.getElementById('log'),
    countPill: document.getElementById('countPill'),
    stampViaje: document.getElementById('stampViaje'),
    stampProcesado: document.getElementById('stampProcesado'),
  };

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  els.fecha.value = todayStr();

  els.stampViaje.addEventListener('click', () => selectOrigen('viaje'));
  els.stampProcesado.addEventListener('click', () => selectOrigen('procesado'));

  function selectOrigen(v){
    origenSel = v;
    els.stampViaje.classList.toggle('active', v === 'viaje');
    els.stampProcesado.classList.toggle('active', v === 'procesado');
  }

  function loadEntries(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      console.error('Error leyendo almacenamiento', e);
      return [];
    }
  }

  function saveEntries(entries){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }catch(e){
      console.error('Error guardando', e);
      els.err.textContent = 'No se pudo guardar el registro en este dispositivo.';
    }
  }

  function fmtFecha(iso){
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function render(){
    const entries = loadEntries();
    els.countPill.textContent = entries.length === 1 ? '1 registro' : `${entries.length} registros`;

    if(entries.length === 0){
      els.log.innerHTML = '<div class="empty">Aún no hay registros. Agrega el primero arriba.</div>';
      return;
    }

    const sorted = [...entries].sort((a,b) => (b.fecha + b.horaInicio).localeCompare(a.fecha + a.horaInicio));

    els.log.innerHTML = sorted.map(e => {
      const dur = (e.durHoras || 0) > 0 || (e.durMin || 0) > 0
        ? `${e.durHoras || 0}h ${e.durMin || 0}min`
        : '—';
      return `
      <div class="entry ${e.origen}">
        <div class="entry-top">
          <span class="unidad-tag">${escapeHtml(e.unidad)}</span>
          <span class="origen-tag">${e.origen === 'viaje' ? 'Viaje' : 'Procesado'}</span>
          <button class="del-btn" title="Eliminar" data-id="${e.id}">✕</button>
        </div>
        <div class="entry-grid">
          <div><span class="lbl">Fecha</span><span class="val">${fmtFecha(e.fecha)}</span></div>
          <div><span class="lbl">Horario</span><span class="val">${e.horaInicio || '--:--'} – ${e.horaFin || '--:--'}</span></div>
          <div><span class="lbl">Limpias</span><span class="val clean">${e.limpias}</span></div>
          <div><span class="lbl">Sucias</span><span class="val dirty">${e.sucias}</span></div>
          <div><span class="lbl">Lavado a mano</span><span class="val">${dur}</span></div>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const remaining = loadEntries().filter(e => e.id !== id);
        saveEntries(remaining);
        render();
      });
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  document.getElementById('btnAdd').addEventListener('click', () => {
    els.err.textContent = '';

    const fecha = els.fecha.value;
    const unidad = els.unidad.value.trim().toUpperCase();
    const horaInicio = els.horaInicio.value;
    const horaFin = els.horaFin.value;
    const limpias = els.limpias.value === '' ? null : parseInt(els.limpias.value, 10);
    const sucias = els.sucias.value === '' ? null : parseInt(els.sucias.value, 10);
    const durHoras = els.durHoras.value === '' ? 0 : parseInt(els.durHoras.value, 10);
    const durMin = els.durMin.value === '' ? 0 : parseInt(els.durMin.value, 10);

    if(!fecha){ els.err.textContent = 'Indica la fecha.'; return; }
    if(!unidad){ els.err.textContent = 'Indica el número económico de la unidad.'; return; }
    if(!origenSel){ els.err.textContent = 'Selecciona si la unidad viene de viaje o procesado.'; return; }
    if(!horaInicio || !horaFin){ els.err.textContent = 'Indica hora de inicio y de fin.'; return; }
    if(limpias === null || sucias === null){ els.err.textContent = 'Indica cuántas rejas limpias y sucias.'; return; }

    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      fecha, unidad, origen: origenSel,
      horaInicio, horaFin,
      limpias, sucias,
      durHoras, durMin,
    };

    const entries = loadEntries();
    entries.push(entry);
    saveEntries(entries);

    // reset form (keep fecha as today)
    els.unidad.value = '';
    els.horaInicio.value = '';
    els.horaFin.value = '';
    els.limpias.value = '';
    els.sucias.value = '';
    els.durHoras.value = '';
    els.durMin.value = '';
    selectOrigen(null);
    origenSel = null;
    els.unidad.focus();

    render();
  });

  render();
</script>
</body>
</html>
